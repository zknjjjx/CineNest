services:
  cmstv:
    image: zknjjjx/cinenest:latest   # Docker Hub 预构建镜像（amd64 / arm64 / armv7）
    # build: ./app                   # 想本地构建时取消注释，并注释掉上一行
    container_name: cmstv
    restart: unless-stopped
    init: true
    environment:
      - TZ=Asia/Shanghai
      - RUN_AT=04:00        # 每天自动检测时间
      - ALLOW_ADULT=0       # 1=保留成人站点
    ports:
      - "8899:8080"
    volumes:
      - ./data:/data
